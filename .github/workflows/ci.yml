name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -m unit
      - run: python -m pytest -m local_integration
      - run: python scripts/build_submission.py --check-sync
      - run: python scripts/generate_docs.py --check
      - run: python scripts/build_submission.py --all --strict
      - run: python scripts/build_submission.py --check-manifest
      - run: python scripts/validate_submission.py dist/submission.zip --strict
      - uses: actions/upload-artifact@v4
        with:
          name: submissions
          path: |
            dist/**/submission.zip
            dist/release_manifest.json

  adk-conformance:
    # Authority level 6: google-adk's own config model and skill loader.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt "google-adk==2.9.2"
      - run: python -m pytest tests/test_adk_conformance.py tests/test_skill_runtime_contract.py tests/test_validator_levels.py
      - run: python scripts/build_submission.py --all
      - run: |
          for zip in dist/submission.zip dist/*/submission.zip; do
            python scripts/adk_conformance.py "$zip" > /dev/null || { echo "ADK rejects $zip"; exit 1; }
          done
