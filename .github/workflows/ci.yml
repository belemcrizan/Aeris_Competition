name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python scripts/build_submission.py --check-sync
      - run: python scripts/build_submission.py --all --strict
      - run: python scripts/validate_submission.py dist/submission.zip --strict
